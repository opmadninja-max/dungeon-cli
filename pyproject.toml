[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeon-cli"
version = "0.1.0"
description = "A single-player terminal text adventure with an LLM Dungeon Master"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dungeon-cli = "cli:main"

[tool.setuptools]
# Flat layout: setuptools auto-discovery finds dm/, ui/, engine/ and content/
# and refuses the build as ambiguous. Declare them explicitly.
packages = ["dm", "ui", "engine", "content"]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
